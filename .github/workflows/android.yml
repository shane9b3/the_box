name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (security review F5, 2026-11-09): nothing by default; each job names what it needs.
# Actions are pinned to full commit SHAs (the tag in the trailing comment).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGP 9.4 needs JDK 17+; we build with 21 (same as local, see docs/m0-toolchain.md).
      # :data unit tests use Robolectric sdk=35, which needs a JDK 21 runtime.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :data:testDebugUnitTest :player:testDebugUnitTest :ui:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon lintAll

      # No debug APK artifact (security review F4, 2026-11-09): on this public repo any signed-in user could download a
      # debug build with its thebox-debug:// links; nothing in the repo consumes it. Releases are built and signed locally.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            data/build/reports/tests/
            player/build/reports/tests/
            ui/build/reports/tests/
            app/build/reports/tests/
