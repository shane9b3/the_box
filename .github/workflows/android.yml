name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # AGP 9.4 needs JDK 17+; we build with 21 (same as local, see docs/m0-toolchain.md).
      # :data unit tests use Robolectric sdk=35, which needs a JDK 21 runtime.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :data:testDebugUnitTest :player:testDebugUnitTest :ui:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            data/build/reports/tests/
            player/build/reports/tests/
            ui/build/reports/tests/
