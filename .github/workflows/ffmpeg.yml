# Builds the Media3 decoder_ffmpeg (audio-only, LGPL) AAR consumed by the :ffmpeg module.
# See tools/ffmpeg/README.md.
name: ffmpeg-aar

on:
  workflow_dispatch:
    inputs:
      media3_tag:
        description: androidx/media tag
        default: "1.11.1"
      ffmpeg_branch:
        description: FFmpeg branch (per decoder_ffmpeg README at the tag)
        default: release/6.0
      abis:
        description: Space-separated ABIs
        default: armeabi-v7a arm64-v8a
  push:
    tags:
      - "ffmpeg-*"

permissions:
  contents: read

concurrency:
  group: ffmpeg-aar-${{ github.ref }}
  cancel-in-progress: false

env:
  MEDIA3_TAG: ${{ inputs.media3_tag || '1.11.1' }}
  FFMPEG_BRANCH: ${{ inputs.ffmpeg_branch || 'release/6.0' }}
  ABIS: ${{ inputs.abis || 'armeabi-v7a arm64-v8a' }}
  NDK_VERSION: 26.1.10909125   # r26b, the NDK the decoder_ffmpeg README is tested on
  CMAKE_VERSION: 3.22.1        # decoder_ffmpeg CMakeLists needs >= 3.21
  ANDROID_API: "23"            # FFmpeg toolchain API level (Media3 minSdk; <= app minSdk 25)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # FFmpeg clone plus per-ABI static libs. The script stamps each ABI with
      # (media3 tag, ffmpeg commit, NDK, API, decoders, upstream script hash) and
      # rebuilds anything that does not match, so a stale cache is harmless.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: tools/ffmpeg/work/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BRANCH }}-${{ env.MEDIA3_TAG }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('tools/ffmpeg/build-ffmpeg-aar.sh') }}
          restore-keys: |
            ffmpeg-${{ env.FFMPEG_BRANCH }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-media3-${{ env.MEDIA3_TAG }}

      - name: Build AAR
        run: |
          # Fetch the latest commit of the branch if the cached clone is behind.
          if [ -d tools/ffmpeg/work/ffmpeg/.git ]; then
            git -C tools/ffmpeg/work/ffmpeg fetch --depth 1 origin "${FFMPEG_BRANCH}" \
              && git -C tools/ffmpeg/work/ffmpeg reset --hard FETCH_HEAD || rm -rf tools/ffmpeg/work/ffmpeg
          fi
          bash tools/ffmpeg/build-ffmpeg-aar.sh

      - name: Show AAR contents
        run: |
          for f in tools/ffmpeg/out/*.aar; do unzip -l "$f" | grep -E 'jni/|classes.jar'; done
          cat tools/ffmpeg/out/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg-${{ env.MEDIA3_TAG }}
          path: |
            tools/ffmpeg/out/*.aar
            tools/ffmpeg/out/*.sha256
            tools/ffmpeg/out/NOTICE-ffmpeg.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ffmpeg-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Media3 decoder_ffmpeg AAR (audio-only, LGPL v2.1+), Media3 ${{ env.MEDIA3_TAG }},
            FFmpeg ${{ env.FFMPEG_BRANCH }}, NDK ${{ env.NDK_VERSION }}, ABIs: ${{ env.ABIS }}.
            The FFmpeg commit and exact configure flags are in NOTICE-ffmpeg.txt.
          files: |
            dist/*.aar
            dist/*.sha256
            dist/NOTICE-ffmpeg.txt
          fail_on_unmatched_files: true
