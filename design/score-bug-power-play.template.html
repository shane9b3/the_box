<style>
body{margin:0}
a{color:#F1BE48}a:hover{color:#ffd77a}
@keyframes gLead{0%{clip-path:inset(0 100% 0 0)}6%{clip-path:inset(0 0 0 0)}94%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes gWipe{0%,3%{clip-path:inset(0 100% 0 0)}11%{clip-path:inset(0 0 0 0)}88%{clip-path:inset(0 0 0 0)}97%,100%{clip-path:inset(0 0 0 100%)}}
@keyframes gFlash{0%,100%{opacity:0}50%{opacity:.45}}
@keyframes gStreak{0%{transform:translateX(-160px) skewX(-24deg)}100%{transform:translateX(980px) skewX(-24deg)}}
@keyframes gLetter{0%{opacity:0;transform:translateY(46px) scale(1.9)}60%{opacity:1;transform:translateY(-4px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes gWord{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes gSlideL{0%{opacity:0;transform:translateX(-36px)}100%{opacity:1;transform:none}}
@keyframes gSlideR{0%{opacity:0;transform:translateX(36px)}100%{opacity:1;transform:none}}
@keyframes gBadge{0%{opacity:0;transform:scale(.3) rotate(-120deg)}70%{opacity:1;transform:scale(1.12) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes gGlow{0%,100%{box-shadow:0 0 0 0 rgba(230,30,50,0)}15%,85%{box-shadow:0 0 36px 4px rgba(230,30,50,.55)}50%{box-shadow:0 0 80px 16px rgba(230,30,50,.8)}}
@keyframes gPopCgy{0%{transform:scale(1.55);color:#F1BE48}40%{transform:scale(.9)}70%{transform:scale(1.06)}100%{transform:scale(1);color:#fff}}
@keyframes gPopEdm{0%{transform:scale(1.55);color:#FF6A2B}40%{transform:scale(.9)}70%{transform:scale(1.06)}100%{transform:scale(1);color:#fff}}
@keyframes ppShine{0%{transform:translateX(-140px) skewX(-24deg)}100%{transform:translateX(820px) skewX(-24deg)}}
@keyframes ppPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.g-lead{animation:gLead 3.6s cubic-bezier(.7,0,.2,1) both}
.g-wrap{animation:gWipe 3.6s cubic-bezier(.7,0,.2,1) both}
.g-flash{animation:gFlash .3s ease-in-out .42s 4}
.g-streak{animation:gStreak 1s cubic-bezier(.4,0,.2,1) .35s both}
.g-streak2{animation:gStreak .8s cubic-bezier(.4,0,.2,1) 1.75s both}
.g-letter{display:inline-block;animation:gLetter .42s cubic-bezier(.2,.8,.2,1) both}
.g-word{animation:gWord .5s ease-in-out 1.15s 3}
.g-in-l{animation:gSlideL .45s cubic-bezier(.2,.8,.2,1) .72s both}
.g-in-r{animation:gSlideR .45s cubic-bezier(.2,.8,.2,1) .9s both}
.g-badge{animation:gBadge .55s cubic-bezier(.2,.8,.2,1) .45s both}
.bug.glow{animation:gGlow 3.6s ease-in-out both}
.score.pop-cgy{animation:gPopCgy .9s cubic-bezier(.2,.8,.2,1) both}
.score.pop-edm{animation:gPopEdm .9s cubic-bezier(.2,.8,.2,1) both}
.pp-tab{transform:translateY(-66px);transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.pp-tab.on{transform:translateY(0);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pp-text{opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.pp-tab.on .pp-text{opacity:1;transform:none;transition:opacity .3s .38s,transform .35s .38s}
.pp-shine{transform:translateX(-140px) skewX(-24deg)}
.pp-tab.on .pp-shine{animation:ppShine .9s cubic-bezier(.4,0,.2,1) .5s both}
.pp-tab.on .pp-label{display:inline-block;animation:ppPulse .45s ease-in-out 1s 2}
.tint{opacity:0;transition:opacity .6s ease}
.tint.on{opacity:1}
.logo{transition:filter .6s ease}
.logo.glow-edm{filter:drop-shadow(0 0 14px rgba(80,140,255,.95))}
.logo.glow-cgy{filter:drop-shadow(0 0 14px rgba(255,90,60,.95))}
button:focus-visible{outline:2px solid #F1BE48;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.g-flash,.g-streak,.g-streak2,.g-word,.pp-tab.on .pp-shine,.pp-tab.on .pp-label{animation:none}.g-letter,.g-badge,.g-in-l,.g-in-r{animation-duration:.01s}.pp-tab,.pp-text,.tint{transition-duration:.01s}}
</style>

<div style="width: 1000px; height: 470px; box-sizing: border-box; background: #0e0e10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; font-family: Inter, system-ui, sans-serif; color: #ffffff" data-canvas-width="1000" data-canvas-height="470" data-document-role="page" data-label="Hockey score bug — goal &amp; power play">
<div style="position: relative; width: 780px; height: 188px">
<div class="{{tabClass}}" style="position: absolute; left: 60px; right: 60px; top: 96px; height: 92px; z-index: 1; border-radius: 0 0 34px 34px; background: {{tabBg}}; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; box-sizing: border-box">
<div class="pp-shine" style="position: absolute; top: -20px; bottom: -20px; left: 0; width: 60px; background: #ffffff; opacity: 0.25"></div>
<div class="pp-text" style="position: relative; display: flex; align-items: center; gap: 20px; height: 34px">
<div class="pp-label" style="font-weight: 800; font-size: 25px; letter-spacing: 0.05em; text-shadow: 0 1px 2px rgba(0,0,0,0.35)">{{ppLabel}}</div>
<div style="width: 2px; height: 26px; background: rgba(255,255,255,0.5)"></div>
<div style="font-weight: 800; font-size: 25px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,0.35)">{{ppClock}}</div>
</div>
</div>
<div class="{{bugClass}}" style="position: absolute; left: 0; top: 0; width: 780px; height: 128px; z-index: 2; border-radius: 999px; background: #1c1c1f; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; display: flex; align-items: center; box-sizing: border-box">
<div class="{{tintCgyClass}}" style="position: absolute; inset: 0; background: linear-gradient(270deg, rgba(0,0,0,0) 42%, rgba(170,16,40,0.5) 75%, rgba(200,16,46,0.9) 100%)"></div>
<div class="{{tintEdmClass}}" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0) 42%, rgba(22,64,170,0.5) 75%, rgba(28,78,200,0.9) 100%)"></div>
<div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 30px">
<img class="{{cgyLogoClass}}" src="bfc98d63-afc0-4ad8-9764-e37c8919933f" alt="Calgary Flames" style="height: 82px; width: auto; display: block">
<div class="{{cgyClass}}" style="font-weight: 800; font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center">{{cgy}}</div>
</div>
<div style="position: relative; width: 1px; height: 66px; background: rgba(255,255,255,0.18); margin: 0 30px"></div>
<div style="position: relative; width: 170px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums">10:22</div>
<div style="font-weight: 600; font-size: 22px; color: #8e8e93">1st</div>
</div>
<div style="position: relative; width: 1px; height: 66px; background: rgba(255,255,255,0.18); margin: 0 30px"></div>
<div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: flex-start; gap: 30px">
<div class="{{edmClass}}" style="font-weight: 800; font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center">{{edm}}</div>
<img class="{{edmLogoClass}}" src="dee72f56-1022-4d12-ad43-f671c2059702" alt="Edmonton Oilers" style="height: 88px; width: auto; display: block">
</div>
<sc-if value="{{showGoal}}" hint-placeholder-val="{{ false }}">
<div class="g-lead" style="position: absolute; inset: 0; background: {{accent}}"></div>
<div class="g-wrap" role="status" aria-label="{{teamName}} goal" style="position: absolute; inset: 0; background: {{base}}; overflow: hidden; display: flex; align-items: center; gap: 28px; padding: 0 40px; box-sizing: border-box">
<div class="g-streak" style="position: absolute; top: -30px; bottom: -30px; left: 0; width: 90px; background: {{accent}}; opacity: 0.6"></div>
<div class="g-streak2" style="position: absolute; top: -30px; bottom: -30px; left: 0; width: 34px; background: #ffffff; opacity: 0.35"></div>
<div class="g-flash" style="position: absolute; inset: 0; background: #ffffff; opacity: 0"></div>
<div class="g-badge" style="position: relative; width: 92px; height: 92px; flex: none; border-radius: 50%; background: #ffffff; border: 3px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isCgy}}" hint-placeholder-val="{{ true }}"><img src="bfc98d63-afc0-4ad8-9764-e37c8919933f" alt="" style="width: 68px; height: auto; display: block"></sc-if>
<sc-if value="{{isEdm}}" hint-placeholder-val="{{ false }}"><img src="dee72f56-1022-4d12-ad43-f671c2059702" alt="" style="width: 80px; height: auto; display: block"></sc-if>
</div>
<div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center">
<div class="g-in-l" style="font-weight: 700; font-size: 15px; letter-spacing: 0.24em; color: #ffffff">{{goalLabel}}</div>
<div class="g-word" style="font-family: 'Barlow Condensed', Inter, sans-serif; font-style: italic; font-weight: 900; font-size: 92px; line-height: 0.86; letter-spacing: 0.04em; color: #ffffff; text-shadow: 0 4px 0 rgba(0,0,0,0.28)">
<span class="g-letter" style="animation-delay: 0.42s">G</span><span class="g-letter" style="animation-delay: 0.5s">O</span><span class="g-letter" style="animation-delay: 0.58s">A</span><span class="g-letter" style="animation-delay: 0.66s">L</span>
</div>
</div>
<div class="g-in-r" style="position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<div style="font-weight: 800; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; color: #ffffff">{{tally}}</div>
<div style="font-weight: 600; font-size: 13px; letter-spacing: 0.08em; color: #ffffff">10:22 · 1ST</div>
</div>
</div>
</sc-if>
</div>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 900px">
<button type="button" sc-camel-on-click="{{edmPp}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #C24A08; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">EDM power play</button>
<button type="button" sc-camel-on-click="{{cgyPp}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #A8122A; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">CGY power play</button>
<button type="button" sc-camel-on-click="{{endPp}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: #2a2a2e; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">End power play</button>
<button type="button" sc-camel-on-click="{{flamesGoal}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #C8102E; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Flames goal</button>
<button type="button" sc-camel-on-click="{{oilersGoal}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #FF4C00; background: #041E42; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Oilers goal</button>
<button type="button" sc-camel-on-click="{{reset}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #ffffff; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Reset</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:470}}">
class Component extends DCLogic {
  state = { cgy: 0, edm: 2, phase: 'idle', team: 'CGY', pp: null, ppTeam: 'EDM', ppSecs: 92, ppGoal: false };
  componentDidMount() {
    this.timers = [];
    this.loopTimers = [];
    if (this.props.autoplay ?? true) this.loopTimers.push(setTimeout(() => this.cycle(), 900));
  }
  componentWillUnmount() {
    this.clearTimers();
    this.stopLoop();
    clearInterval(this.ppTimer);
  }
  clearTimers() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
  }
  stopLoop() {
    (this.loopTimers || []).forEach(clearTimeout);
    this.loopTimers = [];
  }
  cycle() {
    this.clearTimers();
    clearInterval(this.ppTimer);
    this.setState({ cgy: 0, edm: 2, phase: 'idle', pp: null });
    this.loopTimers.push(setTimeout(() => this.startPp('EDM'), 600));
    this.loopTimers.push(setTimeout(() => this.endPp(), 7600));
    this.loopTimers.push(setTimeout(() => this.goal('CGY'), 9400));
    this.loopTimers.push(setTimeout(() => this.cycle(), 15600));
  }
  startPp(team) {
    clearInterval(this.ppTimer);
    this.setState({ pp: team, ppTeam: team, ppSecs: 92 });
    this.ppTimer = setInterval(() => {
      if (this.state.ppSecs <= 1) { this.endPp(); return; }
      this.setState((s) => ({ ppSecs: s.ppSecs - 1 }));
    }, 1000);
  }
  endPp() {
    clearInterval(this.ppTimer);
    this.setState({ pp: null });
  }
  goal(team) {
    this.clearTimers();
    const ppGoal = this.state.pp === team;
    this.setState({ phase: 'idle' });
    this.timers.push(setTimeout(() => {
      this.setState((s) => ({
        phase: 'goal',
        team: team,
        ppGoal: ppGoal,
        cgy: team === 'CGY' ? s.cgy + 1 : s.cgy,
        edm: team === 'EDM' ? s.edm + 1 : s.edm
      }));
      if (ppGoal) clearInterval(this.ppTimer);
      this.timers.push(setTimeout(() => {
        this.setState({ phase: 'after' });
        if (ppGoal) this.endPp();
      }, 3600));
      this.timers.push(setTimeout(() => this.setState({ phase: 'idle' }), 4600));
    }, 40));
  }
  manual(fn) {
    this.stopLoop();
    fn();
  }
  reset() {
    this.stopLoop();
    this.clearTimers();
    clearInterval(this.ppTimer);
    this.setState({ cgy: 0, edm: 2, phase: 'idle', pp: null });
  }
  renderVals() {
    const s = this.state;
    const teams = {
      CGY: { base: '#C8102E', accent: '#F1BE48', name: 'CALGARY FLAMES', tab: 'linear-gradient(180deg, #3a0710 0%, #8f0f24 50%, #C8102E 100%)' },
      EDM: { base: '#041E42', accent: '#FF4C00', name: 'EDMONTON OILERS', tab: 'linear-gradient(180deg, #2a1000 0%, #9a3800 50%, #D9520A 100%)' }
    };
    const t = teams[s.team] || teams.CGY;
    const pt = teams[s.ppTeam] || teams.EDM;
    const after = s.phase === 'after';
    const secs = Math.max(0, s.ppSecs);
    const clock = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    return {
      cgy: s.cgy,
      edm: s.edm,
      showGoal: s.phase === 'goal',
      isCgy: s.team === 'CGY',
      isEdm: s.team === 'EDM',
      bugClass: s.phase === 'goal' ? 'bug glow' : 'bug',
      cgyClass: after && s.team === 'CGY' ? 'score pop-cgy' : 'score',
      edmClass: after && s.team === 'EDM' ? 'score pop-edm' : 'score',
      tabClass: s.pp ? 'pp-tab on' : 'pp-tab',
      tabBg: pt.tab,
      ppLabel: s.ppTeam + ' POWER PLAY',
      ppClock: clock,
      tintCgyClass: s.pp === 'CGY' ? 'tint on' : 'tint',
      tintEdmClass: s.pp === 'EDM' ? 'tint on' : 'tint',
      cgyLogoClass: s.pp === 'CGY' ? 'logo glow-cgy' : 'logo',
      edmLogoClass: s.pp === 'EDM' ? 'logo glow-edm' : 'logo',
      base: t.base,
      accent: t.accent,
      teamName: t.name,
      goalLabel: s.ppGoal ? 'POWER PLAY GOAL' : t.name,
      tally: s.cgy + ' – ' + s.edm,
      edmPp: () => this.manual(() => this.startPp('EDM')),
      cgyPp: () => this.manual(() => this.startPp('CGY')),
      endPp: () => this.manual(() => this.endPp()),
      flamesGoal: () => this.manual(() => this.goal('CGY')),
      oilersGoal: () => this.manual(() => this.goal('EDM')),
      reset: () => this.reset()
    };
  }
}
</script>
