# The Box — version catalog. Verified against Google Maven / Maven Central on 2026-10-13.
# See docs/m0-toolchain.md for the compatibility notes behind each pin.
[versions]
# Build toolchain
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
desugarJdkLibs = "2.1.5"

# Android SDK levels
# Compose BOM 2026.09.00, core 1.19 and ACRA 5.14 require compileSdk 37 (plan said 36).
compileSdk = "37"
minSdk = "25"
targetSdk = "35"

# AndroidX
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
media3 = "1.11.1"
room = "2.8.5"
# Matches the androidx.sqlite version Room 2.8.5 is built against.
sqlite = "2.6.2"
work = "2.12.0"
androidxHilt = "1.4.0"
profileinstaller = "1.4.1"
benchmark = "1.5.0"
baselineprofile = "1.5.0"
androidxTestExtJunit = "1.3.0"
uiautomator = "2.4.0"

# Third party
hilt = "2.60.1"
okhttp = "5.5.0"
coil = "3.6.3"
coroutines = "1.11.0"
serialization = "1.11.0"
tink = "1.23.0"
acra = "5.14.2"
junit5 = "6.1.3"

# M1 data layer (docs/design/m1-data-layer.md §6.1). Verified on Maven Central / Google Maven 2026-10-13.
# okio must equal what OkHttp 5.5.0 requires (okhttp-5.5.0.module: okio 3.18.1); 3.18.2 exists but is not taken.
okio = "3.18.1"
xz = "1.12"
kxml2 = "2.3.0"
# MutableLongIntMap etc. (KMP; JVM variant in :core).
androidxCollection = "1.7.0"
# sdk=35 needs a JDK 21 runtime.
robolectric = "4.17"
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"

[libraries]
# Desugaring
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
# ProcessLifecycleOwner (docs/design/m2-playback-core.md §3.10, §6.1).
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
# M3 (docs/design/m3-guide.md §6.1): GuideViewModel/SearchViewModel in :ui. Same version as lifecycle-runtime-compose.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
# M3 Robolectric Compose tests in :ui (docs/design/m3-guide.md §6.1); versions from the BOM.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Media3
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }   # 1.11.1: SubtitleView only (docs/design/m4-player-ux.md §3.6.3)
# M2 real-ExoPlayer tests under Robolectric (m2 §5.4). Both pull com.squareup.okhttp3:mockwebserver 4.x: exclude it at the use site.
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }

# Persistence
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
sqlite-ktx = { module = "androidx.sqlite:sqlite-ktx", version.ref = "sqlite" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Background work
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Networking / images
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Kotlin libs
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidxCollection" }

# Parsing / compression
xz = { module = "org.tukaani:xz", version.ref = "xz" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

# Security / crash reporting
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
acra-core = { module = "ch.acra:acra-core", version.ref = "acra" }

# Testing
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }

# build-logic (convention plugins) compile classpath
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }

# Convention plugins (build-logic)
thebox-android-application = { id = "thebox.android.application" }
thebox-android-library = { id = "thebox.android.library" }
thebox-android-compose = { id = "thebox.android.compose" }
thebox-android-test = { id = "thebox.android.test" }
thebox-jvm-library = { id = "thebox.jvm.library" }
thebox-hilt = { id = "thebox.hilt" }
