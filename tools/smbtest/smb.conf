# Unprivileged Samba for The Box save-location tests. Port 4445, all state under work/.
# __WORK__ is substituted by run-samba.sh into work/smb.conf.
[global]
    server role = standalone server
    workgroup = WORKGROUP
    netbios name = THEBOXTEST
    smb ports = 4445
    interfaces = lo0
    bind interfaces only = no
    server min protocol = SMB2_02
    client min protocol = SMB2_02
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    map to guest = Bad User
    passdb backend = tdbsam:__WORK__/private/passdb.tdb
    private dir = __WORK__/private
    lock directory = __WORK__/lock
    state directory = __WORK__/state
    cache directory = __WORK__/cache
    pid directory = __WORK__/run
    ncalrpc dir = __WORK__/ncalrpc
    log file = __WORK__/log/%m.log
    max log size = 5000
    logging = file
    # srvsvc (share listing) is served by samba-dcerpcd on Samba >= 4.17; smbd spawns it.
    rpc start on demand helpers = yes

[rewind]
    path = __WORK__/share/rewind
    valid users = testuser
    read only = no
    guest ok = no

[guest]
    path = __WORK__/share/guest
    read only = no
    guest ok = yes
    force user = __ME__
