# The Box app version (read by app/build.gradle.kts; bumped and committed by tools/release/release.py).
# versionCode: a positive integer that strictly increases with every published release (Android refuses a lower one,
#   and the update manifest's `sequence` is this number). Never reuse or lower it, even for a withdrawn release.
# versionName: MAJOR.MINOR.PATCH; the release tag is v<versionName>. A plain bump is PATCH + 1.
versionCode=3
versionName=0.1.1
